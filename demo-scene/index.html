<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conveyor Demo</title>
    <link rel="icon" type="image/x-icon" href="/SCADA/favicon.ico" />
    <script>
      ;(() => {
        try {
          const stored = window.localStorage.getItem('theme')
          const mode =
            stored === 'light' || stored === 'dark' || stored === 'auto'
              ? stored
              : 'auto'
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          const resolved =
            mode === 'auto' ? (prefersDark ? 'dark' : 'light') : mode
          const root = document.documentElement

          root.classList.remove('light', 'dark')
          root.classList.add(resolved)

          if (mode === 'auto') {
            root.removeAttribute('data-theme')
          } else {
            root.setAttribute('data-theme', mode)
          }

          root.style.colorScheme = resolved
        } catch {}
      })()
    </script>
    <script>
      ;(() => {
        const params = new URLSearchParams(window.location.search)
        const redirectPath = params.get('p')

        if (!redirectPath) {
          return
        }

        const targetUrl = new URL(redirectPath, window.location.origin)
        targetUrl.hash = window.location.hash
        window.history.replaceState(null, '', targetUrl)
      })()
    </script>
    <script type="module" crossorigin src="/SCADA/assets/index-BaQoaVSt.js"></script>
    <link rel="stylesheet" crossorigin href="/SCADA/assets/index-BKA3sKaX.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
