<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const segmentCount = 1
      const { pathname, search, hash } = window.location
      const basePath = pathname
        .split('/')
        .slice(0, 1 + segmentCount)
        .join('/')
      const routePath = pathname.slice(basePath.length)

      const normalizedRoutePath = routePath.startsWith('/')
        ? routePath
        : `/${routePath}`

      const redirectUrl =
        `${basePath}/?p=` +
        encodeURIComponent(normalizedRoutePath + search) +
        hash

      window.location.replace(redirectUrl)
    </script>
  </head>
  <body></body>
</html>
